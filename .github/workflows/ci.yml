name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: node test/run.mjs unit

  # Native desktop and live provider tiers require a macOS display and credentials.
  # Run separately on a suitable Mac: node test/run.mjs native or live.
